<!DOCTYPE html>

        height: 100vh;

        align-items: center;
        font-family: Arial, sans-serif;

      }

      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.15);

        border-radius: 20px;
      }

  <body>
    <div class="container">
      <h1>🤖 AI Support Chatbot</h1>
      <p>Your intelligent AI support assistant</p>
